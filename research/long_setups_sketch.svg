<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 360" width="1140" height="360" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11">
  <rect width="1140" height="360" fill="#f7f8fa"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2230"/></marker>
  </defs>

  <!-- Panel 1: demand zone -->
  <g transform="translate(10,40)">
    <rect width="360" height="300" rx="8" fill="#fff" stroke="#dde1e8"/>
    <text x="14" y="-12" font-size="14" font-weight="600" fill="#1b2230">1. Demand zone (all zones)</text>
    <rect x="140" y="182" width="110" height="38" fill="#0f8f74" opacity=".18" stroke="#0f8f74"/>
    <text x="120" y="252" fill="#0f8f74" font-weight="600">&#8593; zone = the swing-low candle</text>
    <polyline points="20,230 60,150 90,120 120,170 145,218 165,140 185,108 210,150 235,180 250,183 280,140 310,100 345,60" fill="none" stroke="#1b2230" stroke-width="2"/>
    <line x1="140" y1="182" x2="345" y2="182" stroke="#2d5bd8" stroke-width="1.5"/>
    <text x="262" y="196" fill="#2d5bd8" font-weight="600">entry (zone top)</text>
    <line x1="140" y1="226" x2="345" y2="226" stroke="#c8414f" stroke-width="1.5"/>
    <text x="262" y="240" fill="#c8414f" font-weight="600">stop (under zone)</text>
    <line x1="185" y1="108" x2="345" y2="108" stroke="#0f8f74" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="200" y="100" fill="#0f8f74" font-weight="600">target = rally high (&#8805; 2R)</text>
    <text x="14" y="24" fill="#5d6779">sharp rise off the low: &#8805; 1.5 ATR and &#8805; 1% within 4 candles</text>
    <circle cx="245" cy="182" r="4" fill="#2d5bd8"/>
    <text x="14" y="268" fill="#5d6779">Bias bullish (or bullish MSS). Price leaves the zone,</text>
    <text x="14" y="284" fill="#5d6779">comes back to it &#8594; buy. Swing must be a real leg.</text>
  </g>

  <!-- Panel 2: reversal B -->
  <g transform="translate(390,40)">
    <rect width="360" height="300" rx="8" fill="#fff" stroke="#dde1e8"/>
    <text x="14" y="-12" font-size="14" font-weight="600" fill="#1b2230">2. Reversal B (fast 4-candle MSS)</text>
    <polyline points="20,40 55,95 75,78 110,140 130,125 160,200 180,170 205,222 225,198 240,210 258,165 290,120 340,32" fill="none" stroke="#1b2230" stroke-width="2"/>
    <line x1="180" y1="170" x2="275" y2="170" stroke="#1b2230" stroke-dasharray="2 3"/>
    <text x="40" y="200" fill="#1b2230">last 4-candle swing high &#8594;</text>
    <text x="268" y="150" fill="#2d5bd8" font-weight="600">close above = MSS &#8593;</text>
    <circle cx="258" cy="165" r="4" fill="#2d5bd8"/>
    <line x1="200" y1="165" x2="345" y2="165" stroke="#2d5bd8" stroke-width="1.5"/>
    <text x="290" y="178" fill="#2d5bd8" font-weight="600">entry</text>
    <line x1="195" y1="230" x2="345" y2="230" stroke="#c8414f" stroke-width="1.5"/>
    <text x="232" y="244" fill="#c8414f" font-weight="600">stop under the 3-day low</text>
    <line x1="200" y1="35" x2="345" y2="35" stroke="#0f8f74" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="232" y="29" fill="#0f8f74" font-weight="600">target 2R</text>
    <text x="40" y="60" fill="#c8414f">normal bias still bearish</text>
    <text x="14" y="268" fill="#5d6779">Downtrend on the normal structure; the small (4-candle)</text>
    <text x="14" y="284" fill="#5d6779">structure breaks up first &#8594; buy at that close.</text>
  </g>

  <!-- Panel 3: reversal D -->
  <g transform="translate(770,40)">
    <rect width="360" height="300" rx="8" fill="#fff" stroke="#dde1e8"/>
    <text x="14" y="-12" font-size="14" font-weight="600" fill="#1b2230">3. Reversal D (bounce gets bigger)</text>
    <polyline points="20,40 60,110 80,92 115,160 135,136 175,215 195,198 210,206 238,170 290,100 340,30" fill="none" stroke="#1b2230" stroke-width="2"/>
    <path d="M86,110 v-18" stroke="#b7790f" stroke-width="3"/><text x="88" y="86" fill="#b7790f">b1</text>
    <path d="M141,160 v-24" stroke="#b7790f" stroke-width="3"/><text x="144" y="132" fill="#b7790f">b2</text>
    <path d="M248,215 v-45" stroke="#2d5bd8" stroke-width="3"/>
    <text x="252" y="200" fill="#2d5bd8" font-weight="600">bounce &gt; max(b1, b2)</text>
    <text x="252" y="214" fill="#2d5bd8" font-weight="600">= MSS &#8593; &#8594; entry</text>
    <circle cx="238" cy="170" r="4" fill="#2d5bd8"/>
    <line x1="190" y1="170" x2="345" y2="170" stroke="#2d5bd8" stroke-width="1.5"/>
    <line x1="165" y1="222" x2="345" y2="222" stroke="#c8414f" stroke-width="1.5"/>
    <text x="252" y="236" fill="#c8414f" font-weight="600">stop under the low</text>
    <line x1="190" y1="32" x2="345" y2="32" stroke="#0f8f74" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="252" y="26" fill="#0f8f74" font-weight="600">target 3R</text>
    <text x="14" y="268" fill="#5d6779">Bounces in the downtrend are small (b1, b2). When the</text>
    <text x="14" y="284" fill="#5d6779">bounce off the new low is bigger &#8594; buy at that close.</text>
  </g>
</svg>
